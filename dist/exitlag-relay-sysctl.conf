# Replies are injected into exitlag0, which has no address. With the usual
# loose reverse-path filter (systemd sets net.ipv4.conf.*.rp_filter = 2 on
# every new interface) the kernel would drop all of them. exitlag-relayd
# writes these too; this keeps systemd-udevd from undoing it.
net.ipv4.conf.exitlag0.rp_filter = 0
net.ipv6.conf.exitlag0.disable_ipv6 = 1
