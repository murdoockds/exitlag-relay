name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The same zig the Nix package is built and tested with.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Check
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          shellcheck -S error install.sh wine/exitlag-wine.sh wine/nfshim/build.sh
          python3 -m py_compile gui/exitlag_relay.py gui/exitlag_run.py wine/exitlag-tray.py

      - name: Build release tarball
        run: make dist VERSION="${GITHUB_REF_NAME//\//-}"

      - uses: actions/upload-artifact@v4
        with:
          name: exitlag-relay
          path: build/exitlag-relay-*.tar.gz

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/exitlag-relay-*.tar.gz \
            --title "$GITHUB_REF_NAME" --generate-notes
